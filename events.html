<body class="events-page">

<div class="starfield starfield-near"></div>
<div class="starfield starfield-far"></div>

<div id="site-header" class="ui-layer"></div>

<main class="calendar-wrap">
    <div id="calendar" class="calendar"></div>

    <div class="legend-header">Calendar Legend</div>

    <div class="calendar-legend">
        <div class="legend-item">
            <div class="legend-title">Moon Phases</div>
            <div class="legend-icons">🌑 🌒 🌓 🌕 🌗 🌘</div>
        </div>

        <div class="legend-item">
            <div class="legend-title">Celestial Events</div>
            <div class="legend-icons">☄️ 🌠 🌌</div>
        </div>

        <div class="legend-item">
            <div class="legend-title">Weather Conditions</div>
            <div class="legend-icons">☀️ ⛅ 🌧️ ❄️</div>
        </div>

        <div class="legend-item">
            <div class="legend-title">Spacetime Event Status</div>
            <div class="legend-icons">
                <span class="dot pending"></span>
                <span class="dot go"></span>
                <span class="dot nogo"></span>
            </div>
        </div>
    </div>
</main>

<div id="overlay" class="overlay"></div>

<section class="support-section">
    <div class="support-title">SUPPORT THE OUTREACH MISSION</div>

    <div class="support-group">

        <a href="https://venmo.com/u/spacetimewithrobert" target="_blank" class="support-btn venmo-btn">Venmo</a>
        <a href="https://www.buymeacoffee.com/stwrobert" target="_blank" class="support-btn coffee-btn">Buy Me a Coffee</a>
    </div>

    <div class="support-group">
        <a href="https://www.highpointscientific.com/?rfsn=6336285.0b6134" target="_blank" class="support-btn secondary telescope-btn">
            I want a telescope
        </a>

        <a href="http://store.seestar.com/SPACE_TIME_WITH_ROBERT" target="_blank" class="support-btn secondary seestar-btn">
            I want a Seestar S50
        </a>
    </div>
</section>


<div id="popup" class="popup">
    <div id="popup-content"></div>
    <button id="closePopupBtn" type="button">Close</button>
</div>

<div id="site-footer"></div>
