<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact | Space Time With Robert</title>

    <link rel="stylesheet" href="style.css" />

</head>

<body>

<div class="app-shell">

    <!-- STARFIELD BACKGROUNDS -->
    <div class="starfield-near"></div>
    <div class="starfield-far"></div>

    <!-- HEADER -->
    <div id="site-header" class="ui-layer"></div>
    <script src="site-state.js" defer></script>
    <script src="outreach-events.js" defer></script>
    <script src="header.js" defer></script>

    <!-- CONTACT PAGE -->
    <main class="contact-page fade-in">

        <!-- HERO -->
        <section class="contact-hero glass-panel">

            <h1>CONTACT</h1>

            <p>
                Questions, outreach requests, astronomy discussions,
                or collaboration inquiries.
            </p>

        </section>

        <!-- CONTACT CARD -->
        <section class="contact-card glass-panel">

            <div class="contact-method">

                <span class="contact-label">EMAIL</span>

                <a href="mailto:your@email.com" class="contact-button">
                    Send Email
                </a>

            </div>

            <div class="response-time">
                Usually replies within 24–72 hours.
            </div>

        </section>

        <!-- OUTREACH -->
        <section class="outreach-card glass-panel">

            <h2>OUTREACH</h2>

            <ul>

                <li>Public telescope events</li>
                <li>School outreach</li>
                <li>Community astronomy events</li>
                <li>Space and astronomy discussions</li>

            </ul>

        </section>

    </main>

</div>

<div id="site-footer"></div>

<script src="footer.js" defer></script>

</body>

</html>
